# CI mirrors the commands used on the integration VM (see docs/dev/testing.md). Not yet exercised on GitHub's runners.
name: ci
on:
  push: {branches: [main, "feature/**"]}
  pull_request:
permissions: {contents: read}

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y nmap
      - run: pip install -r requirements.txt
      - run: python -m unittest -q test_tls_scanner
      - run: PYTHONPATH=. python -m unittest tests/engine/test_runner.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ops/dev/test-stack.sh
      - name: Timeout path (short max duration)
        run: TEST_MAX_DURATION=15 ops/dev/test-stack.sh tests/backend/test_reliability.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -b && npx vitest run && npm run build
        working-directory: frontend

  standalone-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Baseline engine = merge-base with main
        run: |
          mkdir .regression-base
          git archive "$(git merge-base HEAD origin/main)" tls_scanner tls_scan.py | tar -x -C .regression-base
      - run: bash tests/regression/compare.sh
