defaults:
  scan:
    ports: fast
    crypto: standard
    resolve_dns: true
  logging:
    level: info
    file: logs/scan.log
  export:
    directory: scan_reports
    formats:
      - csv
      - cbom
      - md
      - html
    filename_template: "{timestamp}_{report_name}"
  checks:
    certificate:
      enabled: true
      expires_within_days: 30
      trust:
        enabled: true
        public_store:
          enabled: true
        custom_stores: []

reports:
  - name: external_anssi_weekly
    description: Public-facing endpoints checked against ANSSI TLS policy.
    frequency: weekly
    target_groups:
      - external_public_endpoints
    encryption_policies:
      mode: strict_all
      names:
        - anssi_encryption_policy

  - name: pki_trust_test
    description: Public PKI trust-store validation test profile.
    frequency: manual
    scan:
      ports: 443
    target_groups:
      - pki_trust_test_endpoints
    encryption_policies:
      mode: strict_all
      names:
        - anssi_encryption_policy
