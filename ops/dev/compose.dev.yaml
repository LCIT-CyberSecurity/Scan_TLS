# Integration/dev stack. Run on the integration VM with a dedicated project name and ports >= 5000.
name: orion-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?set DEV_DB_PASSWORD}
      POSTGRES_DB: orion
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion"]
      interval: 3s
      retries: 20
  api:
    build: {context: ../.., dockerfile: ops/docker/backend.Dockerfile, args: {WITH_DEV: "true"}}
    environment: &env
      ORION_DATABASE_URL: postgresql+psycopg://orion:${DEV_DB_PASSWORD}@postgres:5432/orion
      ORION_ENVIRONMENT: development
      ORION_COOKIE_SECURE: "false"
      ORION_SESSION_SECRET: ${DEV_SESSION_SECRET:-dev-only-insecure-secret-change-me}
      ORION_STORAGE_ROOT: /var/lib/orion
    volumes: [data:/var/lib/orion]
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["5001:8000"]
    command: sh -c "cd backend && alembic upgrade head && cd .. && uvicorn --factory orion_app.app:create_app --host 0.0.0.0 --port 8000"
  worker:
    build: {context: ../.., dockerfile: ops/docker/backend.Dockerfile, args: {WITH_DEV: "true"}}
    environment: *env
    volumes: [data:/var/lib/orion]
    depends_on: [api]
    command: python -m orion_app.workers.worker
  scheduler:
    build: {context: ../.., dockerfile: ops/docker/backend.Dockerfile, args: {WITH_DEV: "true"}}
    environment: *env
    depends_on: [api]
    command: python -m orion_app.scheduler.scheduler
volumes:
  pgdata:
  data:
