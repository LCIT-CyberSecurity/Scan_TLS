# Isolated automated-test stack (no published ports; everything on its own network).
name: tlsscan-test
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: tls_scan, POSTGRES_PASSWORD: "${TEST_DB_PASSWORD:?}", POSTGRES_DB: tls_scan}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U tls_scan"], interval: 2s, retries: 30}
  lab-tls:
    build: {context: ../.., dockerfile: tests/lab/lab-tls.Dockerfile}
    networks: {default: {aliases: [intranet.acme.local]}}  # the private-PKI scenarios are scanned under their real name
  lab-dns:
    build: {context: ../.., dockerfile: tests/lab/dns/Dockerfile}
  smtp-sink:
    build: {context: ../.., dockerfile: tests/lab/smtp_sink/Dockerfile}
  openldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment: {LDAP_ORGANISATION: Example, LDAP_DOMAIN: example.org, LDAP_ADMIN_PASSWORD: ldap-test-admin-pw, LDAP_TLS_VERIFY_CLIENT: never,
                  LDAP_TLS_CRT_FILENAME: ldap.crt, LDAP_TLS_KEY_FILENAME: ldap.key, LDAP_TLS_CA_CRT_FILENAME: ca.crt, LDAP_TLS_DH_PARAM_FILENAME: dhparam.pem}
    volumes: [./.ldap-certs:/container/service/slapd/assets/certs:ro]
  mock-graph:
    build: {context: ../.., dockerfile: tests/lab/mock_graph/Dockerfile}
  mock-oidc:
    build: {context: ../.., dockerfile: tests/lab/mock_oidc/Dockerfile}
    environment: {MOCK_OIDC_ISSUER: "http://mock-oidc:8080"}
  api:
    build: &build {context: ../.., dockerfile: ops/docker/backend.Dockerfile, args: {WITH_DEV: "true"}}
    environment: &env
      TLS_SCAN_DATABASE_URL: postgresql+psycopg://tls_scan:${TEST_DB_PASSWORD}@postgres:5432/tls_scan
      TLS_SCAN_ENVIRONMENT: test
      TLS_SCAN_COOKIE_SECURE: "false"
      TLS_SCAN_SESSION_SECRET: crashtest-only-session-secret
      TLS_SCAN_LOCAL_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:?}
      TLS_SCAN_OIDC_ISSUER: http://mock-oidc:8080
      TLS_SCAN_OIDC_CLIENT_ID: tls-scan-test
      TLS_SCAN_OIDC_CLIENT_SECRET: crashtest-only
      TLS_SCAN_OIDC_DEFAULT_ROLE: USER
      TLS_SCAN_SSO_AUTO_PROVISION: "true"
      TLS_SCAN_GOOGLE_ISSUER: http://mock-oidc:8080
      TLS_SCAN_GOOGLE_CLIENT_SECRET: crashtest-only
      TLS_SCAN_PUBLIC_BASE_URL: http://api:8000
      TLS_SCAN_GRAPH_LOGIN_URL: http://mock-graph:8080
      TLS_SCAN_GRAPH_BASE_URL: http://mock-graph:8080/v1.0
      TLS_SCAN_GRAPH_CLIENT_SECRET: graph-test-secret
      TLS_SCAN_DIRECTORY_CLIENT_SECRET: graph-test-secret
      TLS_SCAN_LDAP_BIND_PASSWORD: ldap-test-admin-pw
      TLS_SCAN_RATE_LIMIT_ENABLED: "false"
      TLS_SCAN_SCHEDULER_POLL_SECONDS: "2"
      TLS_SCAN_WORKER_POLL_SECONDS: "1"
      TLS_SCAN_MAX_SCAN_DURATION_SECONDS: "${TEST_MAX_DURATION:-300}"
      TLS_SCAN_STORAGE_ROOT: /var/lib/tls-scan
    volumes: [data:/var/lib/tls-scan]
    depends_on: {postgres: {condition: service_healthy}, mock-oidc: {condition: service_started}, mock-graph: {condition: service_started}, openldap: {condition: service_started}}
    command: sh -c "cd backend && alembic upgrade head && cd .. && uvicorn --factory tls_scan_app.app:create_app --host 0.0.0.0 --port 8000"
    healthcheck: {test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health/ready"], interval: 2s, retries: 40}
  worker:
    build: *build
    environment: *env
    volumes: [data:/var/lib/tls-scan]
    depends_on: {api: {condition: service_healthy}}
    command: python -m tls_scan_app.workers.worker
  scheduler:
    build: *build
    environment: *env
    depends_on: {api: {condition: service_healthy}}
    command: python -m tls_scan_app.scheduler.scheduler
  tests:
    build: *build
    environment:
      <<: *env
      TEST_API_URL: http://api:8000
      TEST_LAB_HOST: lab-tls
      TEST_LDAP_CA_FILE: /ldap-certs/ca.crt
    volumes: [data:/var/lib/tls-scan, "../../tests:/app/tests:ro", "./.ldap-certs:/ldap-certs:ro"]
    depends_on: {api: {condition: service_healthy}, worker: {condition: service_started}, lab-tls: {condition: service_started}, lab-dns: {condition: service_started}}
    profiles: [tests]
    command: pytest -x -q tests/backend
volumes:
  data:
