# Isolated automated-test stack (no published ports; everything on its own network).
name: orion-test
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: orion, POSTGRES_PASSWORD: "${TEST_DB_PASSWORD:?}", POSTGRES_DB: orion}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U orion"], interval: 2s, retries: 30}
  lab-tls:
    build: {context: ../.., dockerfile: tests/lab/lab-tls.Dockerfile}
    networks: {default: {aliases: [intranet.acme.local]}}  # the private-PKI scenarios are scanned under their real name
  lab-dns:
    build: {context: ../.., dockerfile: tests/lab/dns/Dockerfile}
  lab-snmp:
    build: {context: ../.., dockerfile: tests/lab/snmp/Dockerfile}
    healthcheck:
      test: ["CMD-SHELL", "snmpget -v3 -l authPriv -u snmp-ro-test -a SHA-256 -A 'TestAuthPass123!' -x AES -X 'TestPrivacyPass123!' -t 1 -r 0 localhost .1.3.6.1.2.1.1.1.0 >/dev/null"]
      interval: 2s
      retries: 20
  smtp-sink:
    build: {context: ../.., dockerfile: tests/lab/smtp_sink/Dockerfile}
  openldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment: {LDAP_ORGANISATION: Example, LDAP_DOMAIN: example.org, LDAP_ADMIN_PASSWORD: ldap-test-admin-pw, LDAP_TLS_VERIFY_CLIENT: never,
                  LDAP_TLS_CRT_FILENAME: ldap.crt, LDAP_TLS_KEY_FILENAME: ldap.key, LDAP_TLS_CA_CRT_FILENAME: ca.crt, LDAP_TLS_DH_PARAM_FILENAME: dhparam.pem}
    volumes: [./.ldap-certs:/container/service/slapd/assets/certs:ro]
  mock-graph:
    build: {context: ../.., dockerfile: tests/lab/mock_graph/Dockerfile}
  mock-oidc:
    build: {context: ../.., dockerfile: tests/lab/mock_oidc/Dockerfile}
    environment: {MOCK_OIDC_ISSUER: "http://mock-oidc:8080"}
  api:
    build: &build {context: ../.., dockerfile: ops/docker/backend.Dockerfile, args: {WITH_DEV: "true"}}
    environment: &env
      ORION_DATABASE_URL: postgresql+psycopg://orion:${TEST_DB_PASSWORD}@postgres:5432/orion
      ORION_ENVIRONMENT: test
      ORION_COOKIE_SECURE: "false"
      ORION_SESSION_SECRET: crashtest-only-session-secret
      ORION_LOCAL_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:?}
      ORION_OIDC_ISSUER: http://mock-oidc:8080
      ORION_OIDC_CLIENT_ID: orion-test
      ORION_OIDC_CLIENT_SECRET: crashtest-only
      ORION_OIDC_DEFAULT_ROLE: USER
      ORION_SSO_AUTO_PROVISION: "true"
      ORION_GOOGLE_ISSUER: http://mock-oidc:8080
      ORION_GOOGLE_CLIENT_SECRET: crashtest-only
      ORION_PUBLIC_BASE_URL: http://api:8000
      ORION_GRAPH_LOGIN_URL: http://mock-graph:8080
      ORION_GRAPH_BASE_URL: http://mock-graph:8080/v1.0
      ORION_GRAPH_CLIENT_SECRET: graph-test-secret
      ORION_DIRECTORY_CLIENT_SECRET: graph-test-secret
      ORION_SNMP_V3_USERNAME: snmp-ro-test
      ORION_SNMP_V3_AUTH_KEY: TestAuthPass123!
      ORION_SNMP_V3_PRIV_KEY: TestPrivacyPass123!
      ORION_LDAP_BIND_PASSWORD: ldap-test-admin-pw
      ORION_RATE_LIMIT_ENABLED: "false"
      ORION_SCHEDULER_POLL_SECONDS: "2"
      ORION_WORKER_POLL_SECONDS: "1"
      ORION_MAX_SCAN_DURATION_SECONDS: "${TEST_MAX_DURATION:-300}"
      ORION_STORAGE_ROOT: /var/lib/orion
    volumes: [data:/var/lib/orion]
    depends_on: {postgres: {condition: service_healthy}, mock-oidc: {condition: service_started}, mock-graph: {condition: service_started}, openldap: {condition: service_started}}
    command: sh -c "cd backend && alembic upgrade head && cd .. && uvicorn --factory orion_app.app:create_app --host 0.0.0.0 --port 8000"
    healthcheck: {test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health/ready"], interval: 2s, retries: 40}
  worker:
    build: *build
    environment: *env
    volumes: [data:/var/lib/orion]
    depends_on: {api: {condition: service_healthy}}
    command: python -m orion_app.workers.worker
  scheduler:
    build: *build
    environment: *env
    depends_on: {api: {condition: service_healthy}}
    command: python -m orion_app.scheduler.scheduler
  tests:
    build: *build
    environment:
      <<: *env
      TEST_API_URL: http://api:8000
      TEST_LAB_HOST: lab-tls
      TEST_SNMP_HOST: lab-snmp
      TEST_LDAP_CA_FILE: /ldap-certs/ca.crt
    # compose.yaml and .env.example are checked by tests/backend/test_secret_files.py and test_orion_identity.py
    volumes: [data:/var/lib/orion, "../../tests:/app/tests:ro", "./.ldap-certs:/ldap-certs:ro", "../../compose.yaml:/app/compose.yaml:ro",
              "../../.env.example:/app/.env.example:ro"]
    depends_on: {api: {condition: service_healthy}, worker: {condition: service_started}, lab-tls: {condition: service_started}, lab-dns: {condition: service_started}, lab-snmp: {condition: service_healthy}}
    profiles: [tests]
    command: pytest -x -q tests/backend
volumes:
  data:
