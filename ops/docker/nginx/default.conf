# HTTPS entry point. Certificates are mounted at /certs (fullchain.pem, privkey.pem) by the bootstrap.
server {
  listen 80;
  server_name _;
  location /api/health/ { proxy_pass http://api:8000; }
  location / { return 301 https://$host:${TLS_SCAN_HTTPS_PORT}$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate /certs/fullchain.pem;
  ssl_certificate_key /certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  # http:// typed on the HTTPS port: nginx raises error 497 (else "400 Bad Request"); send the browser to https on the same host:port.
  error_page 497 =301 https://$http_host$request_uri;
  root /usr/share/nginx/html;
  client_max_body_size 5m;

  include /etc/nginx/snippets/security.conf;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    # security headers (and a strict CSP for downloaded reports) come from the API itself
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
  location /assets/ { expires 7d; include /etc/nginx/snippets/security.conf; add_header Content-Security-Policy "default-src 'self'" always; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / {
    try_files $uri /index.html;
    include /etc/nginx/snippets/security.conf;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-cache";
  }
}
