[project]
name = "orion-app"
version = "0.1.0"
description = "Orion WebUI (API, worker, scheduler): network discovery, mapping and multi-protocol security analysis around the tls_scanner engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.25",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "authlib>=1.3",
  "httpx>=0.27",
  "croniter>=2.0",
  "ldap3>=2.9.1",
  "python-multipart>=0.0.9",
  "python-gvm>=26.0.0,<27",
  "defusedxml>=0.7.1,<1",
  "dnspython>=2.6",
  "idna>=3.10,<4",
  "mcp>=2.2,<3",
  "python-nmap", "prettytable", "tqdm", "PyYAML", "cryptography", "certifi",
  "pysnmp>=7.1,<8",
  "aioquic>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "aiosmtpd>=1.4"]

[tool.setuptools.packages.find]
where = ["backend/src", "."]
include = ["orion_app*", "tls_scan_app*", "tls_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["backend/src", "."]
