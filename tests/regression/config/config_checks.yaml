# Same scan as config.yaml with the complementary TLS checks enabled: everything historical must stay identical.
defaults:
  scan: {ports: "443,8443,8444,8445,8450,8452", crypto: standard, resolve_dns: true, workers: 2}
  logging: {level: info, file: null}
  export: {directory: /out, formats: [csv, cbom, md, html], filename_template: "{report_name}"}
  checks:
    certificate:
      enabled: true
      expires_within_days: 30
      trust: {enabled: true, public_store: {enabled: true}, custom_stores: []}
      revocation: {enabled: false}
reports:
  - name: lab_plain
    run_by_default: false
    frequency: manual
    target_groups: [lab]
    encryption_policies: {mode: strict_all, names: [anssi_encryption_policy]}
  - name: lab_checks
    run_by_default: false
    frequency: manual
    target_groups: [lab]
    encryption_policies: {mode: strict_all, names: [anssi_encryption_policy]}
    checks:
      tls:
        hostname_san: true
        ocsp_stapling: true
        tls_compression: true
        renegotiation: true
        fallback_scsv: true
        extended_master_secret: true
        ecdhe_groups: true
        ffdhe_groups: true
