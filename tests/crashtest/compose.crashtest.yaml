# CrashTest: a throw-away full stack with demo accounts, fictional data and lab TLS targets.
# Demo passwords exist ONLY here (see seed.py); the application refuses to seed outside TLS_SCAN_CRASHTEST=true.
name: tlsscan-crashtest
x-app: &app
  build: {context: ../.., dockerfile: ops/docker/backend.Dockerfile}
  image: tls-scan-backend:crashtest
  environment: &env
    TLS_SCAN_DATABASE_URL: postgresql+psycopg://tls_scan:crashtest-db@postgres:5432/tls_scan
    TLS_SCAN_ENVIRONMENT: test
    TLS_SCAN_CRASHTEST: "true"
    TLS_SCAN_COOKIE_SECURE: "true"
    TLS_SCAN_SESSION_SECRET: crashtest-only-session-secret
    TLS_SCAN_LOCAL_ADMIN_PASSWORD: Crashtest-Initial-Admin-1!
    TLS_SCAN_PUBLIC_BASE_URL: https://${CRASHTEST_HOST:-localhost}:${CRASHTEST_HTTPS_PORT:-5100}
    TLS_SCAN_OIDC_PROVIDER: generic
    TLS_SCAN_OIDC_ISSUER: http://mock-oidc:8080
    TLS_SCAN_OIDC_CLIENT_ID: tls-scan-crashtest
    TLS_SCAN_OIDC_CLIENT_SECRET: crashtest-only
    TLS_SCAN_LDAP_BIND_PASSWORD: ldap-crashtest-only
    TLS_SCAN_STORAGE_ROOT: /var/lib/tls-scan
    TLS_SCAN_MAX_CONCURRENT_SCANS: "2"
  volumes: [data:/var/lib/tls-scan]
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: tls_scan, POSTGRES_PASSWORD: crashtest-db, POSTGRES_DB: tls_scan}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U tls_scan"], interval: 2s, retries: 30}
  lab-tls:
    build: {context: ../.., dockerfile: tests/lab/lab-tls.Dockerfile}
    networks: {default: {aliases: [intranet.acme.local]}}  # private-PKI scenarios (8470-8475), scanned under their real name
    ports: ["${CRASHTEST_LAB_PORT:-5130}:80"]              # serves the public lab CA certificates under /pki/ (the e2e tests import them)
  lab-dns: {build: {context: ../.., dockerfile: tests/lab/dns/Dockerfile}}   # authoritative zones client.test (AXFR open), refused.test, wild.test, bulk.test
  mock-oidc:
    build: {context: ../.., dockerfile: tests/lab/mock_oidc/Dockerfile}
    environment:
      MOCK_OIDC_ISSUER: http://mock-oidc:8080
      MOCK_OIDC_PUBLIC_BASE_URL: http://${CRASHTEST_HOST:-localhost}:${CRASHTEST_OIDC_PORT:-5110}
    ports: ["${CRASHTEST_OIDC_PORT:-5110}:8080"]
  openldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: TLS Scan CrashTest
      LDAP_DOMAIN: crashtest.example.com
      LDAP_ADMIN_PASSWORD: ldap-crashtest-only
      LDAP_TLS_VERIFY_CLIENT: never
      LDAP_TLS_CRT_FILENAME: ldap.crt
      LDAP_TLS_KEY_FILENAME: ldap.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
      LDAP_TLS_DH_PARAM_FILENAME: dhparam.pem
    volumes:
      - ./ldap-certs/ldap.crt:/container/service/slapd/assets/certs/ldap.crt:ro
      - ./ldap-certs/ldap.key:/container/service/slapd/assets/certs/ldap.key:ro
      - ./ldap-certs/ca.crt:/container/service/slapd/assets/certs/ca.crt:ro
      - ./ldap-certs/dhparam.pem:/container/service/slapd/assets/certs/dhparam.pem:ro
      - ./ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-crashtest.ldif:ro
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "", "-s", "base"]
      interval: 3s
      timeout: 3s
      retries: 30
  smtp-sink:
    build: {context: ../.., dockerfile: tests/lab/smtp_sink/Dockerfile}
    ports: ["${CRASHTEST_MAIL_PORT:-5125}:8025"]
  api:
    <<: *app
    command: sh -c "cd backend && alembic upgrade head && cd .. && uvicorn --factory tls_scan_app.app:create_app --host 0.0.0.0 --port 8000 --proxy-headers"
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health/ready"], interval: 3s, retries: 40}
  worker: {<<: *app, command: python -m tls_scan_app.workers.worker, depends_on: {api: {condition: service_healthy}}}
  scheduler: {<<: *app, command: python -m tls_scan_app.scheduler.scheduler, depends_on: {api: {condition: service_healthy}}}
  webui:
    build: {context: ../.., dockerfile: ops/docker/frontend.Dockerfile}
    image: tls-scan-webui:crashtest
    environment: {TLS_SCAN_HTTPS_PORT: "${CRASHTEST_HTTPS_PORT:-5100}"}
    volumes: ["./certs:/certs:ro"]
    ports: ["${CRASHTEST_HTTPS_PORT:-5100}:443"]
    depends_on: {api: {condition: service_healthy}}
volumes:
  data:
