options {
  directory "/var/cache/bind";
  listen-on { any; };
  listen-on-v6 { none; };
  recursion no;
  allow-query { any; };
  allow-transfer { none; };
  dnssec-validation no;
  version "none";
};
// client.test: an internal zone that accepts zone transfers (AXFR)
zone "client.test" { type master; file "/etc/bind/zones/client.test.zone"; allow-transfer { any; }; };
// refused.test: a zone whose transfer is refused, with names a dictionary can find
zone "refused.test" { type master; file "/etc/bind/zones/refused.test.zone"; allow-transfer { none; }; };
// wild.test: wildcard answers everywhere, two real names
zone "wild.test" { type master; file "/etc/bind/zones/wild.test.zone"; allow-transfer { none; }; };
// reverse zone of 192.0.2.0/24 (documentation range)
zone "2.0.192.in-addr.arpa" { type master; file "/etc/bind/zones/2.0.192.rev"; allow-transfer { none; }; };
// bulk.test: 120 hosts, transferable (grouped import of 100 targets)
zone "bulk.test" { type master; file "/etc/bind/zones/bulk.test.zone"; allow-transfer { any; }; };
