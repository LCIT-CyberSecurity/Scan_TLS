pid /run/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
  access_log off;
  # 80: plain HTTP, no TLS at all
  server { listen 80; location / { return 200 "plain http, no TLS\n"; } }
  # 443: modern TLS 1.2 + 1.3, self-signed certificate (chain not trusted)
  server { listen 443 ssl; ssl_certificate /certs/ok.crt; ssl_certificate_key /certs/ok.key; ssl_protocols TLSv1.2 TLSv1.3; location / { return 200 "ok\n"; } }
  # 8443: legacy TLS 1.2 only with CBC/SHA-1 suites (forbidden by an ANSSI-style policy)
  server { listen 8443 ssl; ssl_certificate /certs/exp.crt; ssl_certificate_key /certs/exp.key; ssl_protocols TLSv1.2; ssl_ciphers AES128-SHA:AES256-SHA:ECDHE-RSA-AES128-SHA; ssl_prefer_server_ciphers on; location / { return 200 "legacy\n"; } }
  # 8444: expired certificate
  server { listen 8444 ssl; ssl_certificate /certs/expired.crt; ssl_certificate_key /certs/expired.key; ssl_protocols TLSv1.2 TLSv1.3; location / { return 200 "expired\n"; } }
  # 8445: certificate expiring in 10 days
  server { listen 8445 ssl; ssl_certificate /certs/soon.crt; ssl_certificate_key /certs/soon.key; ssl_protocols TLSv1.2 TLSv1.3; location / { return 200 "soon\n"; } }
  # 8446: TLS 1.0/1.1 enabled in the configuration (effective only if the OpenSSL build of the image still allows them)
  server { listen 8446 ssl; ssl_certificate /certs/ok.crt; ssl_certificate_key /certs/ok.key; ssl_protocols TLSv1 TLSv1.1 TLSv1.2; ssl_ciphers 'ALL:@SECLEVEL=0'; location / { return 200 "old\n"; } }
  # 8447: post-quantum hybrid key exchange (X25519MLKEM768) preferred; 8448: classical groups only
  server { listen 8447 ssl; ssl_certificate /certs/ok.crt; ssl_certificate_key /certs/ok.key; ssl_protocols TLSv1.3; ssl_ecdh_curve X25519MLKEM768:X25519; location / { return 200 "pqc\n"; } }
  server { listen 8448 ssl; ssl_certificate /certs/ok.crt; ssl_certificate_key /certs/ok.key; ssl_protocols TLSv1.3; ssl_ecdh_curve X25519:prime256v1; location / { return 200 "classical\n"; } }
  # --- complementary TLS checks (lot 1) ---
  # 8450/8451: stapled OCSP response (good / revoked) read from a file; 8452: SAN mismatch; 8453: wildcard certificate
  server { listen 8450 ssl; ssl_certificate /certs/stap.crt; ssl_certificate_key /certs/stap.key; ssl_protocols TLSv1.2 TLSv1.3; ssl_stapling on; ssl_stapling_file /certs/good.ocsp; location / { return 200 "staple good\n"; } }
  server { listen 8451 ssl; ssl_certificate /certs/stap.crt; ssl_certificate_key /certs/stap.key; ssl_protocols TLSv1.2 TLSv1.3; ssl_stapling on; ssl_stapling_file /certs/revoked.ocsp; location / { return 200 "staple revoked\n"; } }
  server { listen 8452 ssl; ssl_certificate /certs/mismatch.crt; ssl_certificate_key /certs/mismatch.key; ssl_protocols TLSv1.2 TLSv1.3; location / { return 200 "mismatch\n"; } }
  server { listen 8453 ssl; ssl_certificate /certs/wild.crt; ssl_certificate_key /certs/wild.key; ssl_protocols TLSv1.2 TLSv1.3; location / { return 200 "wildcard\n"; } }
  # 8454: TLS 1.2 DHE only with 1024-bit parameters (SECLEVEL 0 so that the server accepts to use them)
  server { listen 8454 ssl; ssl_certificate /certs/ok.crt; ssl_certificate_key /certs/ok.key; ssl_protocols TLSv1.2; ssl_ciphers 'DHE-RSA-AES128-GCM-SHA256:@SECLEVEL=0'; ssl_dhparam /certs/dh1024.pem; location / { return 200 "dh1024\n"; } }
  # 8455: DHE with ffdhe2048 parameters and the ffdhe2048 group in TLS 1.3; 8456: a single ECDHE group (secp384r1)
  server { listen 8455 ssl; ssl_certificate /certs/ok.crt; ssl_certificate_key /certs/ok.key; ssl_protocols TLSv1.2 TLSv1.3; ssl_ciphers 'DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256'; ssl_dhparam /certs/dh2048.pem; ssl_ecdh_curve ffdhe2048:secp384r1; location / { return 200 "ffdhe\n"; } }
  server { listen 8456 ssl; ssl_certificate /certs/ok.crt; ssl_certificate_key /certs/ok.key; ssl_protocols TLSv1.2 TLSv1.3; ssl_ecdh_curve secp384r1; location / { return 200 "p384\n"; } }
}
